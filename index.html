<!DOCTYPE html>
<html lang="en">
<head>
	<link rel="stylesheet" href="style.css">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kanban Style Task Manager</title>
</head>
<body>
	<header>
		<div class="header">
			<h1>📋 My Task Board</h1>
			<span id="taskcounterbadge" class="badge">0 tasks</span>
			<div class="controls">
				<select id="prioFilter" class="dropdown">
					<option value="all">All</option>
					<option value="low">Low</option>
					<option value="med">Medium</option>
					<option value="high">High</option>
				</select>
			</div>
		</div>
	</header>

	<main class="board">

		<section id="todo" class="todo-column">
			<div class="columnheader">
				<h2>📘 To Do</h2>
				<ul id="todo" class="taskList"></ul>
				<button class="addBtn" onclick="openModal('todo')">+ Add Task</button>
			</div>
		</section>

		<section id="inprogress" class="ip-column">
			<div class="columnheader">
				<h2>⏳ In Progress</h2>
				<ul id="inprogress" class="taskList"></ul>
				<button class="addBtn" onclick="openModal('inprogress')">+ Add Task</button>
			</div>
		</section>

		<section id="done" class="done-column">
			<div class="columnheader">
				<h2>✅ Done</h2>
				<ul id="done" class="taskList"></ul>
				<div class="btnAct">					
					<button class="addBtn" onclick="openModal('done')">+ Add Task</button>
					<button class="cleardoneBtn" onclick="openModal('done')">Clear All</button>
				</div>
			</div>
		</section>
	</main>

	<div id="taskModal" class="hiddenModal">
		<div class="modalContent">
			<h3 id="modalTitle">Add New Task</h3>

			<input type="hidden" id="taskID">
			<input type="hidden" id="taskStatus">

			<div class="formGroup">
				<label for="taskTitle">Title</label>
				<input type="text" id="taskTitle" placeholder="Task Title" required>
			</div>

			<div class="formGroup">
				<label for="taskDesc">Description</label>
				<textarea id="taskDesc" placeholder="Task Description" rows="3"></textarea>
			</div>

			<div class="formGroup">
				<label for="taskPrio">Priority</label>
				<select id="taskPrio">
					<option value="low">Low</option>
					<option value="med">Medium</option>
					<option value="high">High</option>
				</select>
			</div>

			<div class="formGroup">
				<label for="taskDate">Due Date</label>
				<input type="date" id="taskDate">
			</div>

			<div class="modalAction">
				<button id="savetaskBtn" class="saveBtn">Save</button>
				<button id="canceltaskBtn" class="cancelBtn">Cancel</button>
			</div>

		</div>
		
	</div>

	<script src="taskmanager.js"></script>
</body>
</html>
